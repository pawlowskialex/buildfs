[package]
name = "buildfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Transparently compressing NFSv4.1 userspace filesystem for build artifacts"

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
buildfs-core = { path = "../buildfs-core" }
embednfs = { path = "../../vendor/embednfs" }
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
